name: Voice test
on:
  push:
    branches: [voice-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers scipy faster-whisper
      - run: python tools/voice_test.py
