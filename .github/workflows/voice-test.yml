name: Voice test
on:
  push:
    branches: [voice-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with: { path: voice, key: piper-el_GR-rapunzelina-low-v1 }
      - run: pip install piper-tts==1.8.0
      - run: python tools/voice_test.py voice/el_GR-rapunzelina-low.onnx
      - name: Push samples
        run: |
          cd samples && git init -q -b voice-samples && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm samples
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" voice-samples
